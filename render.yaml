services:
  - type: web
    name: traffiq-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt && python ml/training/train_model.py
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: CORS_ORIGINS
        value: '["http://localhost:5173","http://127.0.0.1:5173","https://pushpa-c-30.github.io"]'
